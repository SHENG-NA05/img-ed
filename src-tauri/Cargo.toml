[package]
name = "photoshop-studio"
version = "0.1.0"
default-run = "photoshop-studio"
description = "Professional Desktop Image Editor"
authors = ["DeepMind Agent"]
edition = "2021"

[lib]
name = "photoshop_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "webp"] }
gif = "0.13"
color_quant = "1.1"
base64 = "0.22"
